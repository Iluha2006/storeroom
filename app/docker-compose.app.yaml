services:
  postgres:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: storeroom
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 23paper0843
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: always
    ports:
      - "6379:6379"
    networks:
      - app-network

  storage:
    container_name: minio_storage
    image: quay.io/minio/minio:RELEASE.2025-02-03T21-03-04Z
    restart: always
    command: ["server", "/data", "--console-address=:9001"]
    env_file:
      - ./minio.env
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3


  laravel:
    container_name: laravel_app
    restart: always
    build:
      context: ./
      dockerfile: docker/docker_file/Dockerfile_app
    user: '1000:1000'
    working_dir: /var/www/html/app
    volumes:
        - ./app:/var/www/html
    depends_on:
      - postgres
      - redis
      - storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      TZ: Europe/Moscow

      AWS_ACCESS_KEY_ID: minio124
      AWS_SECRET_ACCESS_KEY: minio1235
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: storeroom
      AWS_ENDPOINT: http://storage:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      FILESYSTEM_DISK: s3

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: storeroom
      DB_USERNAME: postgres
      DB_PASSWORD: 23paper0843

      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx_server
    ports:
      - "8080:80"
    volumes:
      - ./app:/var/www/html:ro
      - ./app/docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./storage/logs:/var/log/nginx
    depends_on:
      - laravel
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data: