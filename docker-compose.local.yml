services:

  postgres:
    restart: always
    image: postgres:18.1-alpine3.22
    volumes:
      - local-db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - TZ=Europe/Moscow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    restart: always
    image: redis:8.4-alpine3.22
    environment:
      - TZ=Europe/Moscow
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    restart: always
    build:
      context: ./
      dockerfile: ./docker/Dockerfile_nginx_local
    volumes:
      - ./docker/logs/nginx:/var/log/nginx
      - ./app:/var/www/html
    ports:
      - ${NGINX_PORT}:80
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - APP_ENV=local
      - NGINX_PHP_HOST=php
      - NGINX_ENTRYPOINT_QUIET_LOGS=1
      - TZ=Europe/Moscow
    depends_on:
      - php

  php:
    restart: always
    build:
      context: ./
      dockerfile: ./docker/Dockerfile_php_local
      args:
        INSTALL_XDEBUG: '${INSTALL_XDEBUG}'
    user: '${UID}:${GID}'
    volumes:
      - ./app:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TZ=Europe/Moscow
    env_file:
      - ./.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  local-db-data:
